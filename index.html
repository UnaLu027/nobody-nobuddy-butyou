<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nobody, No Buddy, But You</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app" id="app">
      <audio id="bgMusic" src="assets/music.mp3" preload="auto" loop></audio>
      <button class="sound-toggle" id="soundToggle" type="button" aria-label="切換背景音樂">
        <span id="soundIcon">♪</span>
      </button>

      <section class="screen intro-screen is-active" id="introScreen" aria-labelledby="introTitle">
        <div class="cover-stage">
          <img class="cover-image" src="assets/cover.png" alt="Nobody, No Buddy, But You 心理測驗封面" />
          <button class="cover-start" id="startButton" type="button" aria-label="開始測驗"></button>
        </div>
      </section>

      <section class="screen quiz-screen" id="quizScreen" aria-live="polite">
        <div class="image-stage">
          <img class="quiz-image" id="questionImage" alt="心理測驗題目" />
          <div class="hotspots" id="hotspots" aria-label="選擇答案"></div>
        </div>
        <div class="floating-actions">
          <button class="ghost-action" id="backButton" type="button">上一題</button>
          <button class="primary-action compact" id="nextButton" type="button">下一題</button>
        </div>
      </section>

      <section class="screen result-screen" id="resultScreen" aria-live="polite">
        <div class="result-wrap">
          <p class="result-label">你的測驗結果</p>
          <img class="result-image" id="resultImage" alt="你的心理測驗結果圖" />
          <p class="save-note">手機可長按圖片儲存，也可以使用下方按鈕下載。</p>
          <div class="result-actions">
            <button class="primary-action compact" id="downloadButton" type="button">下載我的結果圖</button>
            <button class="ghost-action" id="restartButton" type="button">重新測驗</button>
          </div>
        </div>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
