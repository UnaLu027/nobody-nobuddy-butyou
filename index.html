<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nobody, No Buddy, But You</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <script>
      (function clearOldAppCache() {
        var key = "nnb-cache-reset-20260515-3";
        if (sessionStorage.getItem(key)) return;
        if (!("serviceWorker" in navigator) || !("caches" in window)) return;
        sessionStorage.setItem(key, "1");
        Promise.all([
          navigator.serviceWorker.getRegistrations().then(function (registrations) {
            return Promise.all(registrations.map(function (registration) {
              return registration.unregister();
            }));
          }),
          caches.keys().then(function (keys) {
            return Promise.all(keys.map(function (cacheKey) {
              return caches.delete(cacheKey);
            }));
          }),
        ]).then(function () {
          window.location.reload();
        });
      })();
    </script>
    <main class="app" id="app">
      <audio id="bgMusic" src="assets/music.mp3" preload="auto" loop></audio>
      <button class="sound-toggle" id="soundToggle" type="button" aria-label="播放背景音樂">
        <span id="soundIcon">♪</span>
      </button>

      <section class="screen intro-screen is-active" id="introScreen" aria-labelledby="introTitle">
        <div class="cover-stage">
          <img class="cover-image" src="assets/display/cover.jpg" alt="Nobody, No Buddy, But You 心理測驗封面" fetchpriority="high" />
          <div class="cover-hotspots" id="coverHotspots"></div>
        </div>
      </section>

      <section class="screen quiz-screen" id="quizScreen" aria-live="polite">
        <div class="image-stage">
          <img class="quiz-image" id="questionImage" alt="心理測驗題目" decoding="async" fetchpriority="high" />
          <div class="hotspots" id="hotspots" aria-label="選擇答案"></div>
        </div>
        <p class="selection-status" id="selectionStatus" aria-live="polite">點選圖片中的選項以作答</p>
      </section>

      <section class="screen result-screen" id="resultScreen" aria-live="polite">
        <div class="result-wrap">
          <p class="result-label">你的測驗結果</p>
          <img class="result-image" id="resultImage" alt="你的心理測驗結果圖" decoding="async" />
          <p class="save-note">手機可長按圖片儲存，也可以使用下方按鈕下載。</p>
          <div class="result-actions">
            <button class="primary-action compact" id="downloadButton" type="button">下載我的結果圖</button>
            <button class="ghost-action" id="restartButton" type="button">重新測驗</button>
          </div>

          <section class="result-message" aria-label="活動訊息">
            <p>如果今天換成你站在異國的街角，<br />面對聽不懂的語言、看不懂的信件，<br />以及一條不知道該往哪裡走的路——</p>
            <p>你會不會也希望，<br />有一個人願意慢下腳步，<br />陪你確認一次方向，<br />幫你讀懂那些陌生的流程，<br />在你猶豫不決時，輕輕說一句：<br />「沒關係，我陪你一起問。」</p>
            <p>也許那份幫助並不巨大，<br />只是一次同行、一句提醒、一點理解，<br />卻能讓人在陌生的地方忽然感覺到：<br />原來我不是一個人。</p>
            <p>而你的一次停留，<br />也可能成為他在異地最溫暖的記憶。</p>

            <p class="result-password">密碼：<span>604</span></p>
            <p class="result-instruction">請根據你的測驗結果，貼點點至對應動物區塊</p>
          </section>
        </div>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
